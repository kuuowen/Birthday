<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>生ㄖ快樂</title>
<meta property="og:type" content="website">
<meta property="og:title" content="生ㄖ快樂">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@700;900&family=Noto+Serif+TC:wght@700;900&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff6fb0;
    --pink-light:#ffb3d9;
    --mint:#8de8c9;
    --lavender:#c9a9ff;
    --gold:#ffd166;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    font-family:'Fredoka','Noto Sans TC',sans-serif;
    background:#000;
  }
  #stage{
    position:fixed;
    inset:0;
    width:100%;
    height:100dvh;
  }

  /* ---------- 起始畫面 ---------- */
  #start-screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:28px;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
    background:#000;
    transition:opacity .5s ease;
    z-index:10;
  }
  #start-screen.fading{ opacity:0; pointer-events:none; }
  #start-screen h1{
    margin:0;
    font-family:'Noto Serif TC',serif;
    font-weight:900;
    font-size:clamp(22px,6vw,34px);
    color:#fff;
    text-align:center;
    text-shadow:0 0 16px rgba(255,111,176,.85), 0 2px 4px rgba(0,0,0,.5);
    padding:0 20px;
  }
  .start-btn{
    padding:16px 44px;
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:20px;
    color:#fff;
    background:linear-gradient(135deg,var(--pink),var(--pink-light));
    border:none;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(255,111,176,.45);
    animation:pulseBtn 1.8s ease-in-out infinite;
  }
  .start-btn:active{ transform:scale(.95); }
  .start-btn.loading{
    animation:none;
    opacity:.6;
    cursor:default;
    font-size:17px;
  }
  @keyframes pulseBtn{
    0%,100%{ box-shadow:0 8px 24px rgba(255,111,176,.45); transform:scale(1); }
    50%{ box-shadow:0 10px 34px rgba(255,111,176,.7); transform:scale(1.03); }
  }

  .balloon{
    position:absolute;
    width:56px;
    height:70px;
    border-radius:50% 50% 50% 50%/45% 45% 55% 55%;
    animation:floatY 4s ease-in-out infinite alternate;
    opacity:.9;
  }
  .balloon::after{
    content:"";
    position:absolute;
    left:50%;
    top:100%;
    width:1px;
    height:60px;
    background:rgba(255,255,255,.6);
    transform:translateX(-50%);
  }
  @keyframes floatY{
    from{ transform:translateY(0) rotate(-3deg); }
    to{ transform:translateY(-22px) rotate(3deg); }
  }
  .b1{ left:8%;  top:18%; background:radial-gradient(circle at 30% 25%, #fff, var(--pink) 70%); animation-delay:.1s; }
  .b2{ left:18%; top:60%; background:radial-gradient(circle at 30% 25%, #fff, var(--mint) 70%); animation-delay:.6s; }
  .b3{ right:10%;top:15%; background:radial-gradient(circle at 30% 25%, #fff, var(--lavender) 70%); animation-delay:.3s; }
  .b4{ right:16%;top:58%; background:radial-gradient(circle at 30% 25%, #fff, var(--gold) 70%); animation-delay:.9s; }

  /* ---------- 黑幕轉場 ---------- */
  #black-overlay{
    position:absolute;
    inset:0;
    background:#000;
    opacity:0;
    z-index:30;
    transition:opacity .6s ease;
    pointer-events:none;
  }
  #black-overlay.cover{ opacity:1; }
  #black-overlay.lift{ opacity:0; transition:opacity 1.3s ease; }

  /* ---------- 影片揭曉畫面（滿版全螢幕） ---------- */
  #video-scene{
    position:absolute;
    inset:0;
    z-index:5;
    background:#000;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
  }
  #video-scene.active{ opacity:1; pointer-events:auto; }
  #bday-video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    background:#000;
  }
  .bottom-fade{
    position:absolute;
    left:0; right:0; bottom:0;
    height:40%;
    background:linear-gradient(to top, rgba(0,0,0,.62), rgba(0,0,0,0));
    z-index:2;
    pointer-events:none;
  }
  .headline{
    position:absolute;
    left:50%;
    top:calc(env(safe-area-inset-top,0px) + 9%);
    z-index:3;
    width:min(92vw, 460px);
    transform:translate(-50%, 16px) scale(.8);
    opacity:0;
    pointer-events:none;
  }
  .headline svg{
    display:block;
    width:100%;
    height:auto;
    overflow:visible;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,.45));
  }
  .headline text{
    stroke-linejoin:round;
    paint-order:stroke fill;    /* 描邊畫在字後面，只露出外緣一半 */
  }
  /* 第 10 秒（Hello Kitty 段）的英文標題：tspan 自帶同色描邊，只是把字加粗 */
  .hl-en text{
    font-family:'Dancing Script',cursive;
    font-weight:700;
    stroke-width:1.8px;
  }
  /* 結尾定格的中文祝福：深色描邊，黃字在淺色氣球背景上才讀得出來 */
  .hl-tw text{
    font-family:'Microsoft JhengHei','Microsoft JhengHei UI','微軟正黑體',
                'PingFang TC','Noto Sans TC',sans-serif;
    font-weight:700;
    stroke:rgba(0,0,0,.5);
    stroke-width:3px;
  }
  .hl-tw svg{
    filter:drop-shadow(0 2px 5px rgba(0,0,0,.55)) drop-shadow(0 0 14px rgba(0,0,0,.35));
  }
  #video-scene.text-reveal .hl-en{
    animation:popIn .8s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  #video-scene.final-title .hl-tw{
    animation:popIn .8s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes popIn{
    to{ opacity:1; transform:translate(-50%, 0) scale(1); }
  }

  /* ---------- 彩帶紙屑 ---------- */
  #confetti-layer{
    position:absolute;
    inset:0;
    z-index:4;
    overflow:hidden;
    pointer-events:none;
  }
  .confetti-piece{
    position:absolute;
    top:-5vh;
    width:8px;
    height:14px;
    opacity:0;
    animation-name:confettiFall;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }
  @keyframes confettiFall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(115vh) rotate(680deg); opacity:.9; }
  }
  /* ---------- 標題退場（把畫面讓給禮物盒） ---------- */
  @keyframes popOut{
    to{ opacity:0; transform:translate(-50%, -10px) scale(.92); }
  }
  #video-scene.text-hide .hl-en{
    animation:popOut .5s ease forwards;
  }

  /* ---------- 互動禮物盒 ---------- */
  /* 抖動掛在 wrapper 上，燭火疊層在裡面，才會跟影片同步位移 */
  #frame-wrap{ position:absolute; inset:0; }
  #frame-wrap.shaking{
    animation:boxShake 2.1s ease-in-out infinite;
    will-change:transform;
  }
  /* 影片此刻是純黑底，整格輕晃看起來就是盒子在抖；
     底下墊 scale 是為了不讓邊緣露出黑邊 */
  @keyframes boxShake{
    0%   { transform:translate(0,0)      rotate(0)      scale(1.014); }
    3%   { transform:translate(-5px,1px) rotate(-.75deg) scale(1.014); }
    6.5% { transform:translate(5px,-2px) rotate(.75deg)  scale(1.014); }
    10%  { transform:translate(-4px,2px) rotate(-.6deg)  scale(1.014); }
    13.5%{ transform:translate(4px,-1px) rotate(.6deg)   scale(1.014); }
    17%  { transform:translate(-2px,1px) rotate(-.3deg)  scale(1.014); }
    20%  { transform:translate(0,0)      rotate(0)       scale(1.014); }
    100% { transform:translate(0,0)      rotate(0)       scale(1.014); }
  }

  /* 結尾定格：極輕的持續抖動，讓畫面不會死掉 */
  #frame-wrap.final-hold{
    animation:finalTremble 2.4s ease-in-out infinite;
    will-change:transform;
  }

  /* 結尾定格後，只有燭火那一小塊用 sprite 循環，看起來還在燒 */
  #flame-loop{
    position:absolute;
    overflow:hidden;
    opacity:0;
    pointer-events:none;
    /* 四邊羽化。垂直方向在 90% 前就收乾淨，讓蠟燭完全留給底下的定格畫面；
       火焰落在 x 15~85%、y 21~82%，不會被吃到 */
    -webkit-mask-image:
      linear-gradient(to right,  rgba(0,0,0,0) 0%, #000 10%, #000 90%, rgba(0,0,0,0) 100%),
      linear-gradient(to bottom, rgba(0,0,0,0) 0%, #000 14%, #000 78%, rgba(0,0,0,0) 90%, rgba(0,0,0,0) 100%);
    -webkit-mask-composite:source-in;
    mask-image:
      linear-gradient(to right,  rgba(0,0,0,0) 0%, #000 10%, #000 90%, rgba(0,0,0,0) 100%),
      linear-gradient(to bottom, rgba(0,0,0,0) 0%, #000 14%, #000 78%, rgba(0,0,0,0) 90%, rgba(0,0,0,0) 100%);
    mask-composite:intersect;
  }
  #flame-loop .strip{
    position:absolute;
    left:0; top:0;

  #frame-wrap.final-hold #flame-loop{ opacity:1; }
  #frame-wrap.final-hold #flame-loop .strip{
    animation:flameLoop .4583s steps(11) infinite;
  }
  /* translateX(-100%) = 位移自身寬度(11格)，配 steps(11) 剛好停在第 0..10 格 */
  @keyframes flameLoop{
    from{ transform:translateX(0); }
    to  { transform:translateX(-100%); }
  }
  @keyframes finalTremble{
    0%,100%{ transform:translate(0,0)         rotate(0)       scale(1.012); }
    20%    { transform:translate(-2px,1px)    rotate(-.18deg) scale(1.012); }
    40%    { transform:translate(2px,-1.5px)  rotate(.18deg)  scale(1.012); }
    60%    { transform:translate(-1.5px,-1px) rotate(-.12deg) scale(1.012); }
    80%    { transform:translate(1.5px,1px)   rotate(.12deg)  scale(1.012); }
  }

  #gift-gate{
    position:absolute;
    inset:0;
    z-index:6;
    opacity:0;
    pointer-events:none;
    transition:opacity .4s ease;
  }
  #gift-gate.on{ opacity:1; }
  #gift-hotspot{
    position:absolute;
    margin:0;
    padding:0;
    border:none;
    background:transparent;
    border-radius:18px;
    cursor:pointer;
    -webkit-appearance:none;
    pointer-events:none;
  }
  #gift-gate.on #gift-hotspot{ pointer-events:auto; }

  #touch-label{
    position:absolute;
    transform:translateX(-50%);
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
  }
  #gift-gate.on #touch-label{
    animation:touchIn .5s ease .8s forwards;
  }
  @keyframes touchIn{
    from{ opacity:0; }
    to  { opacity:1; }
  }
  #touch-label span{
    display:inline-block;
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:clamp(24px,7.4vw,40px);
    letter-spacing:.06em;
    color:#ffdf9b;
    text-shadow:0 0 18px rgba(255,193,94,.7), 0 2px 6px rgba(0,0,0,.55);
    animation:touchBob 1.7s ease-in-out infinite;
  }
  @keyframes touchBob{
    0%,100%{ transform:translateY(0) scale(1); }
    50%    { transform:translateY(-6px) scale(1.05); }
  }
  #touch-label span.nudge{ animation:touchNudge .5s ease; }
  @keyframes touchNudge{
    0%,100%{ transform:translateY(0) scale(1); }
    35%    { transform:translateY(-3px) scale(1.2); }
    65%    { transform:translateY(0) scale(.97); }
  }
</style>
</head>

  <div id="video-scene">

          <path id="arcPathBottom" d="M 4 153 Q 160 71 316 153" fill="none"/>
        </defs>
        <text font-size="44" text-anchor="middle" xml:space="preserve">
          <textPath href="#arcPathTop" startOffset="50%">
            <tspan fill="#3fc1e9" stroke="#3fc1e9">Wen Jie</tspan>
          </textPath>
        </text>
        <text font-size="33" text-anchor="middle" xml:space="preserve">
          <textPath href="#arcPathBottom" startOffset="50%">
            <tspan fill="#0abab5" stroke="#0abab5">Happy Birthday !</tspan>
          </textPath>
        </text>
      </svg>
    </div>

    <!-- 結尾定格用的中文祝福（弧線 id 另取，避免和上面的重複）-->
    <div class="headline hl-tw">
      <svg viewBox="0 0 320 150" preserveAspectRatio="xMidYMid meet">
        <defs>
          <!-- 兩條同心圓弧（圓心 160,300）。弧長都約 225，兩行的左右緣才會切齊 -->
          <path id="arcTwTop"    d="M 51.2 74.9 A 250 250 0 0 1 268.8 74.9" fill="none"/>
          <path id="arcTwBottom" d="M 53.2 125.0 A 205 205 0 0 1 266.8 125.0" fill="none"/>
        </defs>
        <text id="hl1" font-size="30" text-anchor="middle" xml:space="preserve">
          <textPath href="#arcTwTop" startOffset="50%">
            <tspan fill="#ff5050">祝</tspan><tspan fill="#ffff50"> 多益金色證書</tspan>
          </textPath>
        </text>
        <!-- 第二行少一個空格，用 letter-spacing 補回來，讓兩行等寬 -->
        <text id="hl2" font-size="30" text-anchor="middle" xml:space="preserve">
          <textPath href="#arcTwBottom" startOffset="50%">
            <tspan fill="#5050ff">研究所成功上岸</tspan>
          </textPath>
        </text>
      </svg>
    </div>
    <div id="gift-gate">
      <button id="gift-hotspot" type="button" aria-label="打開禮物盒"></button>
      <div id="touch-label"><span>Touch !</span></div>
    </div>
    <audio id="bgm" loop preload="none"></audio>
  </div>

  <div id="black-overlay"></div>

</div>

<script>
  var startScreen = document.getElementById('start-screen');
  var startBtn    = document.getElementById('start-btn');
  var blackOverlay= document.getElementById('black-overlay');
  var videoScene  = document.getElementById('video-scene');
  var video       = document.getElementById('bday-video');
  var confettiLayer = document.getElementById('confetti-layer');
  var bgm         = document.getElementById('bgm');

  var CONFETTI_COLORS = ['#ff5fa2','#8de8c9','#ffd166','#c9a9ff','#ff8fc7','#7fd9ff'];

  function spawnConfetti(count){
    for (var i = 0; i < count; i++){
      var piece = document.createElement('div');
      piece.className = 'confetti-piece';
      var left = Math.random() * 100;
      var duration = 2.6 + Math.random() * 2.4;
      var delay = Math.random() * 1.2;
      var color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      var isRound = Math.random() > .5;
      piece.style.left = left + 'vw';
      piece.style.background = color;
      piece.style.borderRadius = isRound ? '50%' : '2px';
      piece.style.animationDuration = duration + 's';
      piece.style.animationDelay = delay + 's';
      confettiLayer.appendChild(piece);
    }
  }

  // 背景音樂（影片本身維持靜音）。BGM_new.m4a：AAC 128kbps 44.1kHz 立體聲、73 秒，
  // 只有 1.13 MB，所以直接內嵌，不依賴網路。
  // 要改成外部檔就把下面整串換成網址，例：'https://<帳號>.github.io/<repo>/bgm.m4a'
  // （注意 github.com/.../blob/... 那種連結回傳的是網頁不是音檔，不能用）
  var BGM_URL = 'bgm.m4a';
  if (BGM_URL) { bgm.src = BGM_URL; bgm.preload = 'auto'; }

  function playBgm(){
    if (!bgm.src) return;
    bgm.currentTime = 0;
    bgm.play().catch(function(){});
  }

  var FADE_TO_BLACK  = 600;
  var BLACK_TO_BRIGHT = 1300;

  // 網站版：影片是外部檔案，載入到能順順播完之前先擋住按鈕，
  // 免得對方按下去卡在黑畫面。
  var btnLabel = startBtn.textContent;
  var mediaReady = false;
  function markReady(){
    if (mediaReady) return;
    mediaReady = true;
    startBtn.disabled = false;
    startBtn.classList.remove('loading');
    startBtn.textContent = btnLabel;
  }
  function showProgress(){
    if (mediaReady) return;
    var pct = 0;
    try {
      if (video.buffered.length && video.duration){
        pct = Math.min(99, Math.round(
          video.buffered.end(video.buffered.length - 1) / video.duration * 100));
      }
    } catch(e){}
    startBtn.textContent = pct ? ('載入中 ' + pct + '%') : '載入中…';
  }
  startBtn.disabled = true;
  startBtn.classList.add('loading');
  startBtn.textContent = '載入中…';
  video.addEventListener('progress', showProgress);
  video.addEventListener('canplaythrough', markReady);
  video.addEventListener('loadeddata', function(){ if (video.readyState >= 4) markReady(); });
  setTimeout(markReady, 20000);   // 保底：網路再慢也讓他按得下去

  startBtn.addEventListener('click', function(){
    startBtn.disabled = true;
    startScreen.classList.add('fading');
    blackOverlay.classList.add('cover');

    setTimeout(function(){
      videoScene.classList.add('active');
      blackOverlay.classList.add('lift');
      video.currentTime = 0;
      video.play().catch(function(){});
      playBgm();
    }, FADE_TO_BLACK + 50);

    setTimeout(function(){
      blackOverlay.style.pointerEvents = 'none';
    }, FADE_TO_BLACK + 50 + BLACK_TO_BRIGHT);
  });

  var frameWrap  = document.getElementById('frame-wrap');
  var flame      = document.getElementById('flame-loop');
  var gate       = document.getElementById('gift-gate');
  var hotspot    = document.getElementById('gift-hotspot');
  var touchLabel = document.getElementById('touch-label');

  // 影片是 Video1(27.000s) + Video2_new(10.000s) 無損接起來的，所以偏移量剛好整數
  var V1_END         = 27.0;
  var TEXT_REVEAL_AT = 10;            // 專屬標題浮出（Hello Kitty 段）
  var TEXT_HIDE_AT   = 24.4;          // 標題退場，禮物盒場景要乾淨
  var HOLD_AT        = V1_END + 4.05; // 盒子已落定、蓋子還沒掀起的那一格
                                      // （4.18s 蓋子開始動，所以停在 4.05 最安全）
  var FREEZE_AT      = V1_END + 8.6875; // 影片 9.05s 之後開始淡黑。8.6875 落在第 208 個
                                      // 來源幀正中央，也是燭火迴圈的中點——sprite 的第 5 格
                                      // 與這一格完全相同，疊上去看不出接縫

  // 禮盒在影片畫面中的位置（比例，量自 4.05s 那格）
  var BOX = { cx:0.490, cy:0.559, h:0.252 };
  var HOT = { w:0.78,   h:0.36 };     // 熱區放大到比盒子寬，手機好按

  // 燭火區塊（比例）。刻意只涵蓋火焰與上方散景、避開蠟燭：
  // 鏡頭結尾是緩慢縮放，畫面不同高度需要的位移補償不同，單一位移對不齊蠟燭那種
  // 高反差輪廓；散景是模糊的，差一兩個像素看不出來。
  var FLAME = { x0:0.38056, x1:0.60000, y0:0.37031, y1:0.47188 };

  var textRevealed = false, textHidden = false;
  var gateArmed = false, opened = false, frozen = false;

  // 影片是 object-fit:contain，要先算出畫面實際被畫在哪個矩形裡
  function contentRect(){
    var vw = video.videoWidth, vh = video.videoHeight;
    var ew = video.clientWidth, eh = video.clientHeight;
    if (!vw || !vh || !ew || !eh) return null;
    var s = Math.min(ew / vw, eh / vh);
    var w = vw * s, h = vh * s;
    return { x:(ew - w) / 2, y:(eh - h) / 2, w:w, h:h };
  }

  function layoutGate(){
    var r = contentRect();
    if (!r) return;
    hotspot.style.left   = (r.x + (BOX.cx - HOT.w / 2) * r.w) + 'px';
    hotspot.style.top    = (r.y + (BOX.cy - HOT.h / 2) * r.h) + 'px';
    hotspot.style.width  = (HOT.w * r.w) + 'px';
    hotspot.style.height = (HOT.h * r.h) + 'px';
    touchLabel.style.left = (r.x + BOX.cx * r.w) + 'px';
    touchLabel.style.top  = (r.y + (BOX.cy + BOX.h / 2 + 0.05) * r.h) + 'px';
    flame.style.left   = (r.x + FLAME.x0 * r.w) + 'px';
    flame.style.top    = (r.y + FLAME.y0 * r.h) + 'px';
    flame.style.width  = ((FLAME.x1 - FLAME.x0) * r.w) + 'px';
    flame.style.height = ((FLAME.y1 - FLAME.y0) * r.h) + 'px';
  }
  video.addEventListener('loadedmetadata', layoutGate);
  window.addEventListener('resize', layoutGate);
  window.addEventListener('orientationchange', layoutGate);

  function armGate(){
    if (gateArmed || opened) return;
    gateArmed = true;
    video.pause();
    try { video.currentTime = HOLD_AT; } catch(e){}   // 對準那一格，不要停過頭
    layoutGate();
    frameWrap.classList.add('shaking');
    gate.classList.add('on');
  }

  function openGift(){
    if (!gateArmed || opened) return;
    opened = true;
    gate.classList.remove('on');
    frameWrap.classList.remove('shaking');
    video.play().catch(function(){});
    spawnConfetti(52);
  }
  hotspot.addEventListener('click', openGift);

  // 不讓影片跑到自己的淡黑收尾。定格後疊上燭火 sprite，火還會繼續燒。
  // Video2_new 結尾沒有文字卡，所以中文祝福可以疊上去收場，不會打架。
  function freezeEnd(){
    if (frozen) return;
    frozen = true;
    video.pause();
    try { video.currentTime = FREEZE_AT; } catch(e){}
    layoutGate();
    frameWrap.classList.add('final-hold');
    videoScene.classList.add('final-title');   // 只叫出中文祝福，英文標題維持退場
  }

  // 點到盒子以外的地方：把 Touch! 彈一下，提示要按的是盒子
  videoScene.addEventListener('click', function(e){
    if (!gateArmed || opened) return;
    if (e.target === hotspot || hotspot.contains(e.target)) return;
    var s = touchLabel.firstElementChild;
    s.classList.remove('nudge');
    void s.offsetWidth;
    s.classList.add('nudge');
  });

  function tick(t){
    if (!textRevealed && t >= TEXT_REVEAL_AT){
      textRevealed = true;
      videoScene.classList.add('text-reveal');
      spawnConfetti(46);
    }
    if (textRevealed && !textHidden && t >= TEXT_HIDE_AT){
      textHidden = true;
      videoScene.classList.add('text-hide');
      setTimeout(function(){ confettiLayer.innerHTML = ''; }, 600);
    }
    if (!gateArmed && t >= HOLD_AT) armGate();
    if (opened && !frozen && t >= FREEZE_AT) freezeEnd();
  }

  // timeupdate 一秒只跳 4 次，會停過頭；有 rVFC 就用逐格的
  if ('requestVideoFrameCallback' in HTMLVideoElement.prototype){
    var onFrame = function(now, meta){
      tick(meta.mediaTime);
      video.requestVideoFrameCallback(onFrame);
    };
    video.requestVideoFrameCallback(onFrame);
  }
  video.addEventListener('timeupdate', function(){ tick(video.currentTime); });

  // 標題排版：第二行少一個空格，量出兩行寬度差再用 letter-spacing 補平。
  // 各平台中文字體的空格寬度不同（微軟正黑體 0.333em、蘋方約 0.25em），
  // 所以在執行時量，不寫死；順便確保兩行都塞得進弧線。
  function layoutHeadline(){
    var svg = document.querySelector('.hl-tw svg');   // 量測節點要掛在中文那個，才會套到正黑體
    var e1 = document.getElementById('hl1'), e2 = document.getElementById('hl2');
    var a1 = document.getElementById('arcTwTop'), a2 = document.getElementById('arcTwBottom');
    if (!svg || !e1 || !e2 || !a1 || !a2) return;
    var NS = 'http://www.w3.org/2000/svg', BASE = 30;
    function measure(str){
      var t = document.createElementNS(NS, 'text');
      t.setAttribute('font-size', BASE);
      t.setAttribute('x', 0); t.setAttribute('y', 0);
      t.setAttributeNS('http://www.w3.org/XML/1998/namespace', 'xml:space', 'preserve');
      t.textContent = str;
      svg.appendChild(t);
      var L = t.getComputedTextLength();
      t.parentNode.removeChild(t);
      return L;
    }
    var p1 = a1.getTotalLength(), p2 = a2.getTotalLength();
    var l1 = measure('祝 多益金色證書'), l2 = measure('研究所成功上岸');
    if (!l1 || !l2) return;
    var fs = Math.min(BASE, BASE * Math.min(p1, p2) * 0.96 / l1);   // 留 4% 邊
    var ls = (l1 - l2) / 7 * (fs / BASE);                            // 7 個字，補平寬度差
    e1.setAttribute('font-size', fs.toFixed(2));
    e2.setAttribute('font-size', fs.toFixed(2));
    e2.style.letterSpacing = ls.toFixed(3) + 'px';   // 屬性寫法 WebKit 不吃，要用 style
    // letter-spacing 會在最後一字後也多加一份，置中會左偏半格，沿弧線往回補一點。
    // （WebKit 對含 textPath 的 <text> 回傳的 getBBox 不可靠，所以用算的，不用量的）
    e1.querySelector('textPath').setAttribute('startOffset', '50%');
    e2.querySelector('textPath')
      .setAttribute('startOffset', (50 + (ls / 2) / p2 * 100).toFixed(3) + '%');
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutHeadline);
  else window.addEventListener('load', layoutHeadline);
  window.addEventListener('resize', layoutHeadline);

</script>

</body>
</html>
